<script>
'use strict';
/* Gestão Rural — dados em localStorage (chave versionada). Para backend futuro, troque load()/save(). */
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const br=s=>!s?'—':/^\d{4}-\d{2}-\d{2}$/.test(String(s))?String(s).split('-').reverse().join('/'):esc(String(s)),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const empty=m=>`<p class="empty">${m}</p>`,byDate=(a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''));
const KEY='nelore.v1',KEYS=['animals','events','notes','repro','sanit','pasto','estoque','fin','excluidos'],blank=()=>{const o={version:1};KEYS.forEach(k=>o[k]=[]);return o};
/* E10: peso válido = número (ou texto numérico) maior que 0 e até 2000 kg; nulo, vazio, texto ou fora da faixa NUNCA vira 0 */
const wkg=v=>{const n=typeof v==='number'?v:typeof v==='string'&&/^\s*\d+([.,]\d+)?\s*$/.test(v)?parseFloat(v.replace(',','.')):NaN;return isFinite(n)&&n>0&&n<=2000?n:null};

const COV=['Cobertura (monta natural)','Inseminação artificial','IATF'],amap=()=>new Map(S.animals.map(a=>[nrm(a.tag),a]));
function rFiltered(af){const m=amap(),act=!!(af.lot||af.cat);let skipped=0;
 const R=S.repro.filter(x=>{if(!inP(x.date,af))return false;if(act){const a=m.get(tagk(x));if(!a){skipped++;return false}if(!lotOk(a,af.lot)||(af.cat&&a.cat!==af.cat))return false}return true});return{R,skipped}}
function rCalc(R){const dg={},cov=new Set(),pt=new Map(),dm=new Map();
 R.forEach(x=>{const k=tagk(x);if(!k)return;
  if(COV.includes(x.tipo))cov.add(k);
  else if(x.tipo==='Diagnóstico de gestação'){const o=dg[k]=dg[k]||{c:null,p:0,cf:0};if(x.res==='Prenhe'||x.res==='Vazia'){if(!o.c||x.date>o.c.date){o.c=x;o.cf=0}else if(x.date===o.c.date&&x.res!==o.c.res)o.cf=1}else o.p=1}
  else if(x.tipo==='Parto/nascimento')pt.set(k+'|'+x.date+'|'+x.res,x);
  else if(x.tipo==='Desmama')dm.set(k+'|'+x.date+'|'+(x.res||'—'),x)});
 let pos=0,neg=0,pend=0,conf=0;Object.values(dg).forEach(o=>{if(o.c&&o.cf)conf++;else if(o.c){o.c.res==='Prenhe'?pos++:neg++}else pend++});
 let vivo=0,nati=0,psr=0,des=0,dinc=0;pt.forEach(x=>{x.res==='Nasceu vivo'?vivo++:x.res==='Natimorto'?nati++:psr++});dm.forEach(x=>{(!x.res||x.res==='—'||x.res==='Desmamado')?des++:dinc++});
 const av=pos+neg;return{exp:cov.size,pos,neg,pend,conf,av,semDiag:[...cov].filter(k=>!dg[k]).length,vivo,nati,psr,des,dinc,tp:av?pos/av*100:null,td1:cov.size?des/cov.size*100:null,td2:vivo?des/vivo*100:null,total:R.length}}
const ind=(t,v,n,fx,w)=>`<div class="ind"><h4>${t}</h4><b>${v}</b><small>${n}</small><small class="fx">${fx}</small>${w?`<small class="w">${w}</small>`:''}</div>`;
const wn=(n,r)=>[n===0?'Sem base de cálculo no período e grupo selecionados.':n<10?`Base pequena (${n} animais): interpretar com cautela.`:'',r>100?'Acima de 100%: o período contém desmamas de bezerros nascidos fora dele, ou faltam registros.':''].filter(Boolean).join(' ');
const hrow=(l,c)=>`<tr><td>${esc(l)}</td><td>${c.exp}</td><td>${c.av}</td><td>${c.pos}</td><td>${c.neg}</td><td>${c.pend}</td><td>${c.tp===null?'—':pct(c.tp)}</td><td>${c.vivo}</td><td>${c.nati}</td><td>${c.des}</td></tr>`;
const hhead=l=>`<div class="tw"><table><thead><tr><th>${l}</th><th>Matrizes expostas</th><th>Avaliadas</th><th>Positivas</th><th>Negativas</th><th>Pendentes</th><th>Taxa de prenhez</th><th>Nasc. vivos</th><th>Natimortos</th><th>Desmamados</th></tr></thead><tbody>`;
function repView(af){const{R,skipped}=rFiltered(af);
 const extra=skipped?`<div class="alert">${skipped} registro(s) de reprodução ficaram de fora porque a matriz não está no Rebanho (foi arquivada ou nunca foi cadastrada), e sem o cadastro não dá para aplicar o filtro de lote ou categoria.</div>`:'';
 if(!R.length)return extra+empty('Nenhum registro de reprodução no período e grupo selecionados. Os indicadores usam os registros do módulo Reprodução; nada é estimado.');
 const c=rCalc(R),m=amap(),M={},Lt={};R.forEach(x=>{(M[x.date.slice(0,7)]=M[x.date.slice(0,7)]||[]).push(x);const a=m.get(tagk(x)),k=a?lotName(a):'(matriz arquivada ou sem cadastro)';(Lt[k]=Lt[k]||[]).push(x)});
 const ht=histTxt(reproHist(R)),hx=ht?`<p class="rnote"><b>Histórico:</b> ${ht}</p>`:'';
 return extra+hx+`<div class="inds">
 ${ind('Taxa de prenhez (por diagnóstico)',pct(c.tp),`${c.pos} positiva(s) de ${c.av} matriz(es) avaliada(s)`,'Fórmula: matrizes com diagnóstico positivo ÷ (positivas + negativas) × 100. Cada matriz conta uma vez, pelo diagnóstico conclusivo mais recente do período. Pendentes e conflitantes ficam de fora.',wn(c.av,0))}
 ${ind('Matrizes avaliadas',c.av,'base da taxa de prenhez','Matrizes distintas com diagnóstico conclusivo (Prenhe ou Vazia) no período.')}
 ${ind('Diagnósticos positivos',c.pos,'matrizes','Matrizes cujo diagnóstico conclusivo mais recente é “Prenhe”.')}
 ${ind('Diagnósticos negativos',c.neg,'matrizes','Matrizes cujo diagnóstico conclusivo mais recente é “Vazia”.')}
 ${ind('Diagnósticos pendentes',c.pend,`matrizes com diagnóstico sem resultado${c.conf?'; '+c.conf+' com resultados conflitantes no mesmo dia (fora do cálculo)':''}`,'Pendente não conta como positivo nem negativo. Além disso, '+c.semDiag+' matriz(es) coberta(s) no período ainda não têm diagnóstico registrado.')}
 ${ind('Matrizes expostas',c.exp,'cobertas, inseminadas ou IATF','Matrizes distintas com Cobertura, Inseminação artificial ou IATF no período.')}
 ${ind('Bezerros nascidos vivos',c.vivo,`${c.nati} natimorto(s); ${c.psr} parto(s) sem resultado informado (não contados como vivos)`,'Registros “Parto/nascimento” com resultado “Nasceu vivo”; 1 registro = 1 bezerro. Registros idênticos (mesma matriz, data e resultado) contam uma vez.')}
 ${ind('Bezerros desmamados',c.des,c.dinc?c.dinc+' registro(s) de desmama com resultado incompatível ignorado(s)':'registros de desmama no período','Registros “Desmama” com resultado “Desmamado” ou sem resultado; registros idênticos contam uma vez.')}
 ${ind('Taxa de desmama (ref.: matrizes expostas)',pct(c.td1),`${c.des} desmamado(s) ÷ ${c.exp} matriz(es) exposta(s)`,'Fórmula: bezerros desmamados ÷ matrizes expostas no mesmo período × 100.',wn(c.exp,c.td1||0))}
 ${ind('Taxa de desmama (ref.: nascidos vivos)',pct(c.td2),`${c.des} desmamado(s) ÷ ${c.vivo} nascido(s) vivo(s)`,'Fórmula: bezerros desmamados ÷ bezerros nascidos vivos no mesmo período × 100.',wn(c.vivo,c.td2||0))}</div>
 <p class="note2">A taxa de prenhez mede o resultado do diagnóstico entre as matrizes avaliadas. A taxa de desmama mede os bezerros desmamados em relação a um grupo de referência (matrizes expostas ou nascidos vivos) e não depende de diagnóstico. Dados ausentes nunca são tratados como resultado negativo.</p>
 ${sec('Histórico por mês',hhead('Mês')+Object.keys(M).sort().map(k=>hrow(k.slice(5)+'/'+k.slice(0,4),rCalc(M[k]))).join('')+'</tbody></table></div>','Cada linha refaz o cálculo só com os registros do próprio mês; por isso uma matriz pode aparecer em meses diferentes e a soma das linhas não precisa coincidir com os indicadores do período inteiro.')}
 ${sec('Histórico por lote',hhead('Lote')+Object.keys(Lt).sort((a,b)=>a.localeCompare(b,'pt',{numeric:true})).map(k=>hrow(k,rCalc(Lt[k]))).join('')+'</tbody></table></div>','O lote é o lote atual da matriz no Rebanho (o sistema não guarda o histórico de trocas de lote).')}`}

function movSec(af){const A=aF(af,false),{R}=rFiltered(af),c=rCalc(R.filter(x=>x.tipo==='Parto/nascimento')),ex=s=>A.filter(a=>a.status===s&&inP(a.exit,af)).length,noD=A.filter(a=>a.status!=='Ativo'&&!a.exit).length;
 const fv=k=>S.fin.filter(x=>fcat(x)===k&&x.status==='Efetivado'&&inP(x.date,af)),sm=a=>money(a.reduce((s,x)=>s+(+x.valor||0),0)),V=fv('Venda de animais'),C=fv('Compra de animais');
 const I=[{l:'Nascimentos (data de nascimento no cadastro)',v:A.filter(a=>inP(a.birth,af)).length},{l:'Partos: nasceram vivos (Reprodução)',v:c.vivo},{l:'Partos: natimortos (Reprodução)',v:c.nati},{l:'Vendas (situação Vendido)',v:ex('Vendido')},{l:'Mortes',v:ex('Morto')},{l:'Transferências',v:ex('Transferido')},{l:'Vendas de animais lançadas no Financeiro',v:V.length,s:sm(V)},{l:'Compras de animais lançadas no Financeiro',v:C.length,s:sm(C)}];
 const F='Nascimentos, vendas, mortes e transferências do cadastro usam a data de nascimento e a data de saída do animal. Lote e categoria filtram o rebanho e os partos; o Financeiro não tem vínculo com animais e só filtra por período (lançamentos efetivados).';
 const w=noD?`<p class="note2">${noD} animal(is) com situação diferente de Ativo estão sem data de saída e não entram em nenhum período. Edite o animal e informe a data de saída.</p>`:'';
 return sec('Movimentações do rebanho',I.some(i=>i.v)?hbars(I,v=>String(v))+w:empty('Nenhuma movimentação registrada no período e grupo selecionados.')+w,F)}
function anaView(){const af=ui.af,t=ui.at;
 return `<h2>Análises</h2><p class="note2">Gráficos e indicadores calculados só com os dados cadastrados. Onde faltam dados, a tela avisa em vez de estimar. Animais arquivados (excluídos) não entram nos gráficos de peso e GMD; nos indicadores de reprodução entram como histórico, e a tela informa quando isso acontece.</p>${anaFilters()}
 <div class="tabs"><button data-tab="graf" aria-pressed="${t!=='rep'}">Gráficos</button><button data-tab="rep" aria-pressed="${t==='rep'}">Indicadores de reprodução</button></div>
 ${t==='rep'?repView(af):[evoSec(af),gmdSec(af),lotSec(af),finSec(af),movSec(af)].join('')}`}

function reproOverview(){
 const R=S.repro.filter(x=>x&&x.animal&&x.date),O=openSvc(),due=dueList(),confirmed=O.filter(o=>o.conf).length,
 births=R.filter(x=>x.tipo==='Parto/nascimento').length,weans=R.filter(x=>x.tipo==='Desmama'&&(!x.res||x.res==='—'||x.res==='Desmamado')).length;
 return `<div class="cards">${kpi('Matrizes com prenhez confirmada',confirmed)}${kpi('Partos previstos em 30 dias',due.length)}${kpi('Registros de parto',births)}${kpi('Desmamas registradas',weans)}</div>
 <section><h3>Período de gestação previsto</h3><div class="bar2"><input id="gest" type="number" min="240" max="320" step="1" inputmode="numeric" aria-label="Dias de gestação" value="${gest()}"><button class="pri" data-act="gest">Salvar período</button><button data-act="gest0">Voltar para 285</button></div><p class="note2">Usado só para estimar a data do parto (entre 240 e 320 dias). Os registros de reprodução não são alterados.</p></section>
 <section><h3>Próximos partos estimados</h3><p class="note2">Estimativa de ${gest()} dias após a última cobertura, inseminação ou IATF da matriz, sem parto registrado e sem diagnóstico negativo posterior, apenas para matrizes ativas no Rebanho (vendidas, mortas, transferidas ou arquivadas não geram previsão). Só é gestação confirmada quando há diagnóstico “Prenhe”; sem diagnóstico é apenas uma previsão. Confirme com acompanhamento veterinário; a data pode variar.</p>
 ${due.length?`<div class="tw"><table><thead><tr><th>Matriz</th><th>Evento reprodutivo</th><th>Data do evento</th><th>Previsão</th><th>Dias restantes</th><th>Situação</th></tr></thead><tbody>${due.map(o=>`<tr><td>${esc(o.x.animal)}</td><td>${esc(o.x.tipo)}</td><td>${br(o.x.date)}</td><td>${br(o.d)}</td><td>${o.days}</td><td>${o.conf?'Prenhez confirmada (diagnóstico positivo)':'Sem diagnóstico: apenas estimativa'}</td></tr>`).join('')}</tbody></table></div>`:empty('Nenhum parto estimado para os próximos 30 dias com os registros atuais.')}</section>`;
}

const VIEWS={dash:['Painel',dash],agenda:['Agenda',agenda],notes:['Anotações',notes],animals:['Rebanho',animals],pes:['Pesagem',pesView],
repro:['Reprodução',()=>reproOverview()+crud('repro','Reprodução',`<p class="note2">Registre cobertura, inseminação/IATF, diagnóstico de gestação, parto e desmama. A previsão de parto usa ${gest()} dias após cobertura/IA/IATF e é apenas uma estimativa. Cadastre primeiro a matriz no Rebanho e use o mesmo brinco em todos os eventos.</p>`)],
sanit:['Sanidade',()=>crud('sanit','Sanidade','<p class="note2">Marque como <b>Pendente</b> (ou informe um retorno programado) o que ainda precisa ser feito e use <b>Concluir</b> quando for realizado: concluídos não geram alertas e podem ser reabertos. Vencido = pendente com prazo anterior a hoje. Doses e tratamentos devem seguir a orientação do médico-veterinário.</p>')],
pasto:['Pastagens',()=>crud('pasto','Pastagens e lotes','<p class="note2">Lotação = animais ativos ligados ao pasto, divididos pela área em hectares. Ao digitar no campo Lote do animal um nome de pasto cadastrado, o animal passa a ser ligado ao pasto por um código interno: renomear o pasto atualiza os animais e os registros que o citam. Excluir pede confirmação e mostra o que está associado.</p>')],
estoque:['Estoque',()=>crud('estoque','Estoque',S.estoque.filter(alerta).length?`<div class="alert">${S.estoque.filter(alerta).length} item(ns) em alerta (linhas destacadas).</div>`:'')],
fin:['Financeiro',finView],calc:['Calculadoras',calcView],rel:['Relatórios',relView],ana:['Análises',anaView],data:['Dados',data]};
const staleBanner=()=>stale?`<div class="alert" role="alert"><b>Os dados foram alterados em outra aba.</b> Para não apagar nada, esta aba não salva até ser atualizada. <button class="pri" data-act="reloadstore">Recarregar dados atualizados</button>${dirtyTab?` <button data-act="export">Baixar cópia desta aba</button>`:''}</div>`:'';
/* recarrega do armazenamento (sem mesclar); só volta ao normal se os dados salvos forem legíveis */
function reloadStore(){const c=readStore();if(!c.ok)return toast('Não foi possível ler os dados salvos.',5000);let d;
 if(c.v===null)d=blank();else{try{d=JSON.parse(c.v)}catch(e){d=null}if(!valid(d))return toast('Os dados salvos não puderam ser lidos; esta aba continua bloqueada. Exporte um backup antes de qualquer outra ação.',8000);d=fill(d)}
 const dd=$('#dlg');if(dd.open){if(dd._dirty&&dd.querySelector('#frm')&&!confirm('Descartar o que foi digitado?'))return;dd._dirty=false;dd.close()}
 S=d;loadedRaw=c.v;stale=false;dirtyTab=false;OSC=null;render();toast('Dados atualizados com os da outra aba.',4000);const nm=fillMsg(lastFill);if(nm.length)setTimeout(()=>toast('Atenção nos dados salvos: '+nm.join(' '),12000),4200)}
const recBanner=()=>recovered?`<div class="alert" role="alert"><b>Os dados salvos neste navegador não puderam ser lidos.</b> Nada foi apagado: uma cópia foi guardada. <button data-act="bak">Baixar cópia</button> <button data-act="okrec">Entendi</button></div>`:'';
function labelResponsiveTables(root){root.querySelectorAll('.tw table').forEach(t=>{const heads=[...t.querySelectorAll('thead tr:last-child th')].map(h=>h.innerText.trim());t.querySelectorAll('tbody tr').forEach(tr=>{[...tr.children].forEach((td,i)=>{if(td.tagName!=='TD')return;if(!td.hasAttribute('data-label'))td.setAttribute('data-label',heads[i]||'');});});});}
function render(){OSC=null;$('#app').innerHTML=staleBanner()+recBanner()+banner()+VIEWS[view][1]();labelResponsiveTables($('#app'));if(view==='calc')CALC.forEach((_,i)=>runCalc(i));$('#vt').textContent=VIEWS[view][0];const nv=$('#nav nav'),sl=nv.scrollLeft;nv.innerHTML=Object.entries(VIEWS).map(([k,v])=>`<button data-v="${k}" style="min-width:max-content"${k===view?' aria-current="page"':''}>${ICON[k]}<span>${v[0]}</span></button>`).join('');nv.scrollLeft=sl;
 const cur=nv.querySelector('[aria-current]');if(cur){const r=cur.getBoundingClientRect(),n=nv.getBoundingClientRect();if(r.left<n.left||r.right>n.right)nv.scrollLeft+=r.left-n.left-(n.width-r.width)/2}}
const sp1=s=>{const i=s.indexOf(':');return[s.slice(0,i),s.slice(i+1)]},spL=s=>{const i=s.lastIndexOf(':');return[s.slice(0,i),s.slice(i+1)]};
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.v){view=d.v;ui.q=ui.st=ui.from=ui.to=ui.ss=ui.cs='';render();window.scrollTo(0,0)}
 else if(d.add)form(d.add);
 else if(d.edit){const[a,b]=sp1(d.edit);form(a,b)}
 else if(d.del){const[a,b]=sp1(d.del);del(a,b)}
 else if(d.view)viewAnimal(d.view);
 else if(d.sort){ui.dir=ui.sort===d.sort?-ui.dir:1;ui.sort=d.sort;render()}
 else if(d.sel){ui.sel=d.sel;render()}
 else if(d.nav){const k=+d.nav,c=ui.cal;ui.cal=ui.mode==='month'?new Date(c.getFullYear(),c.getMonth()+k,1):new Date(c.getFullYear(),c.getMonth(),c.getDate()+k*(ui.mode==='week'?7:1));if(ui.mode==='day')ui.sel=fmt(ui.cal);render()}
 else if(d.done){const ok=tx(()=>{const x=S.events.find(v=>v.id===d.done);if(!x)return false;x.status=x.status==='Concluído'?'Pendente':'Concluído'});render()}
 else if(d.mov){const[id,k]=spL(d.mov),x=S.estoque.find(v=>v.id===id);if(!x)return;const q=num(prompt((k==='in'?'Quantidade que entrou':'Quantidade que saiu')+' ('+(x.un||'unid.')+'):'));if(!(q>0))return;if(k==='out'&&q>(+x.qtd||0)+1e-9)return toast('A saída é maior que o estoque.');
  const ok=tx(()=>{const c=S.estoque.find(v=>v.id===id);c.qtd=r6((+c.qtd||0)+(k==='in'?q:-q));(c.mov=c.mov||[]).push({date:fmt(new Date()),q:k==='in'?q:-q})});render();if(ok)toast('Movimento registrado.')}
 else if(d.pay){const x=S.fin.find(v=>v.id===d.pay);if(!x)return;const t=fmt(new Date());if(x.date>t&&!confirm('A data deste lançamento é futura. Efetivar e mudar a data para hoje?'))return;
  const ok=tx(()=>{const c=S.fin.find(v=>v.id===d.pay);if(!c)return false;c.status='Efetivado';if(c.date>t)c.date=t});render();if(ok)toast('Lançamento efetivado.')}
 else if(d.movs)movList(d.movs);
 else if(d.mdel){const[id,i]=spL(d.mdel);movDel(id,+i)}
 else if(d.sdone)sanitDone(d.sdone);
 else if(d.sopen)sanitReopen(d.sopen);
 else if(d.exl)exclList();
 else if(d.exr)exclRestore(d.exr);
 else if(d.exd)exclDrop(d.exd);
 else if(d.pre)preset(d.pre);
 else if(d.tab){ui.at=d.tab;render()}
 else if(d.wadd)weighForm();
 else if(d.wedit){const[a,b]=spL(d.wedit);weighEdit(a,b)}
 else if(d.wdel){const[a,b]=spL(d.wdel);weighDel(a,b)}
 else if(d.act)act(d.act)});
document.addEventListener('keydown',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('btn')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();const i=document.querySelector('#imp');if(i)i.click()}});
const srch=t=>{ui.q=t.value;const p=t.selectionStart;render();const i=$('#q');if(i){i.focus();i.setSelectionRange(p,p)}};

 if(i.id==='sortm'){ui.dir=ui.sort===i.value?-ui.dir:1;ui.sort=i.value;render();return}
 const PR={from:'to',to:'from',af_from:'af_to',af_to:'af_from'};
 if(PR[i.id]&&i.value){const isTo=/to$/.test(i.id),oth=$('#'+PR[i.id]),fv=isTo?(oth&&oth.value):i.value,tv=isTo?i.value:(oth&&oth.value);if(fv&&tv&&fv>tv){toast('A data inicial não pode ser depois da data final.');render();return}}
 if(i.id&&i.id.startsWith('af_')){ui.af[i.id.slice(3)]=i.value;render()}else if(['st','ss','cs','from','to','rep'].includes(i.id)){ui[i.id]=i.value;if(i.id==='rep')ui.st='';render()}else if(i.id==='mode'){ui.mode=i.value;ui.cal=new Date(ui.sel+'T12:00');render()}else if(i.id==='imp'){imp(i.files[0]);i.value=''}});
/* aviso quando outra aba altera "nelore.v1" (o evento "storage" não dispara na aba que gravou) e ao voltar para a aba */
const chkStale=()=>{const c=readStore();if(c.ok&&c.v!==loadedRaw)markStale()};
window.addEventListener('storage',e=>{if(e.storageArea&&e.storageArea!==localStorage)return;if(e.key!==null&&e.key!==KEY)return;chkStale()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)chkStale()});window.addEventListener('focus',chkStale);
/* ---------- Agro Projeto: rotas por hash (#/dash, #/ana, ...) + voltar/avançar ----------
   O hash é "#/" + a chave de VIEWS (dash, agenda, notes, animals, pes, repro, sanit, pasto, estoque, fin, calc, rel, ana, data).
   Só acompanha a variável "view": não lê nem grava dados. */
(()=>{
 const key=h=>{const m=/^#\/([a-z]+)$/.exec(h||'');return m&&Object.prototype.hasOwnProperty.call(VIEWS,m[1])?m[1]:null};
 let last=location.hash;
 if(location.protocol==='file:')document.querySelectorAll('.agro-back').forEach(a=>a.hidden=true); /* "./" só faz sentido servido pelo site */
 const k0=key(location.hash);if(k0)view=k0;               /* link direto: define a tela antes do primeiro render() */
 /* clique no menu: o manipulador original já trocou "view"; aqui só se registra no histórico */
 document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button[data-v]');if(!b)return;
  const r='#/'+view;if(location.hash===r||(r==='#/dash'&&!location.hash))return;
  try{history.pushState(null,'',r);last=r}catch(x){}});
 const onNav=()=>{if(location.hash===last)return;last=location.hash;     /* popstate e hashchange podem disparar juntos */
  const d=$('#dlg');
  if(d.open){closeDlg();                                                 /* formulário aberto: pede confirmação se houver texto digitado */
   if(d.open){try{history.pushState(null,'','#/'+view);last=location.hash}catch(x){}return}}
  view=key(location.hash)||'dash';ui.q=ui.st=ui.from=ui.to=ui.ss=ui.cs='';render();window.scrollTo(0,0)};
 window.addEventListener('popstate',onNav);window.addEventListener('hashchange',onNav);
})();
render();if(bootMsg.length)toast('Atenção nos dados salvos: '+bootMsg.join(' '),12000);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
