name = "agropainel"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "none"
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "agropainel-db"
database_id = "89dd0170-165c-45b5-ac8b-947a3722dfdf"
migrations_dir = "migrations"

[vars]
TELEMETRY = "on"
RETENTION_DAYS = "90"
